[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-game-translator"
version = "0.0.1"
description = "Windows-first Japanese game text extraction, terminology, LLM translation, and reinsertion toolkit."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "JP Game Translator Contributors" }
]
dependencies = []

[project.optional-dependencies]
gui = [
  "PySide6==6.6.2; python_version < '3.9'",
  "PySide6>=6.9,<6.11; python_version >= '3.9'"
]
exe = [
  "pyinstaller>=6.0,<7"
]

[project.scripts]
jgt = "jp_game_translator.cli:main"
jgt-gui = "jp_game_translator.qt_gui:main"
jgt-tk-gui = "jp_game_translator.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jp_game_translator = ["resources/*.json"]
